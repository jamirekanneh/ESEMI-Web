<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard | Elizabeth Sele Mulbah Institute</title>
  <meta name="description" content="Your personal student dashboard — view your profile and grades at ESEMI." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />

  <!-- Firebase SDKs v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    /* ========== Base ========== */
    * { box-sizing: border-box; }

    body {
      padding-top: 80px;
      min-height: 100vh;
    }

    /* ========== Top Bar ========== */
    .topbar {
      background-color: var(--navbar-bg);
      border-bottom: 2px solid var(--brand-red);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 8px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
      transition: var(--transition-base);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .topbar-brand img {
      height: 50px;
    }

    .topbar-brand span {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--brand-red);
    }

    .logout-btn {
      background-color: var(--brand-red);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition-base);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }

    .logout-btn:hover {
      background-color: var(--brand-red-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
    }

    /* ========== Loading / Auth Guard ========== */
    #authGuard {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: #888;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #f0f0f0;
      border-top-color: #b30000;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== Dashboard Content ========== */
    #dashboardContent { display: none; }

    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    /* ========== Profile Card ========== */
    .profile-card {
      background: linear-gradient(135deg, #b30000 0%, #5a0000 100%);
      color: #fff;
      border-radius: 16px;
      padding: 36px 30px;
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 36px;
      box-shadow: 0 8px 30px rgba(179,0,0,0.25);
      flex-wrap: wrap;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.4);
      object-fit: cover;
      background-color: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .profile-info h2 {
      font-size: 1.7rem;
      font-weight: 700;
      margin: 0 0 6px;
      color: #fff;
    }

    .profile-info p {
      margin: 3px 0;
      font-size: 0.95rem;
      opacity: 0.88;
    }

    .profile-badge {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* ========== Info Grid ========== */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 36px;
    }

    .info-tile {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border-left: 4px solid #b30000;
    }

    .info-tile .tile-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      margin-bottom: 6px;
    }

    .info-tile .tile-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #222;
    }

    /* ========== Grades Section ========== */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .section-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #b30000;
      margin: 0;
    }

    .grades-table-wrapper {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .grades-table {
      width: 100%;
      border-collapse: collapse;
    }

    .grades-table thead {
      background-color: #b30000;
      color: #fff;
    }

    .grades-table thead th {
      padding: 14px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .grades-table tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .grades-table tbody tr:hover {
      background-color: #fff5f5;
    }

    .grades-table tbody td {
      padding: 14px 20px;
      font-size: 0.95rem;
    }

    .grade-pill {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .grade-a { background: #d4edda; color: #155724; }
    .grade-b { background: #cce5ff; color: #004085; }
    .grade-c { background: #fff3cd; color: #856404; }
    .grade-d { background: #fde8d8; color: #7f3200; }
    .grade-f { background: #f8d7da; color: #721c24; }

    .no-grades {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 0.95rem;
    }

    /* ========== Responsive ========== */
    @media (max-width: 600px) {
      .profile-card { flex-direction: column; text-align: center; }
      .profile-avatar { margin: 0 auto; }
      .topbar-brand span { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="topbar">
    <a class="topbar-brand" href="Home.html">
      <img src="assets/esemilogo.png" alt="ESEMI Logo" />
      <span>ESEMI</span>
    </a>
    <button class="logout-btn" onclick="logoutStudent()">🚪 Logout</button>
  </div>

  <!-- Auth loading state -->
  <div id="authGuard">
    <div class="spinner"></div>
    <p>Verifying your session…</p>
  </div>

  <!-- Dashboard (shown only when authenticated) -->
  <div id="dashboardContent">
    <div class="page-wrapper">

      <!-- Profile Card -->
      <div class="profile-card" id="profileCard">
        <div class="profile-avatar" id="avatarInitial">?</div>
        <div class="profile-info">
          <h2 id="studentName">Loading…</h2>
          <p id="studentEmail"></p>
          <p id="studentClass"></p>
          <span class="profile-badge" id="studentId"></span>
        </div>
      </div>

      <!-- Info Tiles -->
      <div class="info-grid">
        <div class="info-tile">
          <div class="tile-label">Student ID</div>
          <div class="tile-value" id="tileStudentId">—</div>
        </div>
        <div class="info-tile">
          <div class="tile-label">Class / Grade</div>
          <div class="tile-value" id="tileClass">—</div>
        </div>
        <div class="info-tile">
          <div class="tile-label">Section</div>
          <div class="tile-value" id="tileSection">—</div>
        </div>
        <div class="info-tile">
          <div class="tile-label">Academic Year</div>
          <div class="tile-value" id="tileYear">—</div>
        </div>
      </div>

      <!-- Grades Section -->
      <div class="section-header">
        <h3>📊 My Grades</h3>
      </div>

      <div class="grades-table-wrapper">
        <div id="gradesContainer">
          <div class="no-grades">
            <div class="spinner" style="margin: 0 auto 12px;"></div>
            Loading grades…
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ──────────────────────────────────────────
    // Firebase Config
    // ──────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyDzAJqBjlzIGU7_eU8xOZUSbV9GB6cyNYA",
      authDomain: "esemi-loginsheet.firebaseapp.com",
      projectId: "esemi-loginsheet",
      storageBucket: "esemi-loginsheet.firebasestorage.app",
      messagingSenderId: "698345147857",
      appId: "1:698345147857:web:35c8f24f29bf3a7599e4f0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // ──────────────────────────────────────────
    // Auth Guard — redirect to login if not signed in
    // ──────────────────────────────────────────
    auth.onAuthStateChanged(function (user) {
      if (!user) {
        // Not logged in → send back to login page
        window.location.href = "login.html";
        return;
      }

      // Logged in → show dashboard
      document.getElementById("authGuard").style.display    = "none";
      document.getElementById("dashboardContent").style.display = "block";

      // Populate email immediately (we always have this)
      document.getElementById("studentEmail").textContent = user.email;

      // Fetch student profile from Firestore
      // ⚙️  Assumes a "Students" collection where each document ID = Firebase UID
      //     and has fields: Name, StudentID, Class, Section, AcademicYear
      loadStudentProfile(user);
      loadStudentGrades(user);
    });

    // ──────────────────────────────────────────
    // Load Profile
    // ──────────────────────────────────────────
    function loadStudentProfile(user) {
      db.collection("Students").doc(user.uid).get()
        .then(function (doc) {
          if (doc.exists) {
            const data = doc.data();

            const name    = data.Name        || user.email;
            const id      = data.StudentID   || "—";
            const cls     = data.Class       || "—";
            const section = data.Section     || "—";
            const year    = data.AcademicYear || "2024/2025";

            document.getElementById("studentName").textContent  = name;
            document.getElementById("studentClass").textContent = cls ? "Class: " + cls : "";
            document.getElementById("studentId").textContent    = "ID: " + id;
            document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();

            document.getElementById("tileStudentId").textContent = id;
            document.getElementById("tileClass").textContent     = cls;
            document.getElementById("tileSection").textContent   = section;
            document.getElementById("tileYear").textContent      = year;
          } else {
            // Document doesn't exist yet — fall back to email display
            const name = user.email.split("@")[0];
            document.getElementById("studentName").textContent    = name;
            document.getElementById("avatarInitial").textContent  = name.charAt(0).toUpperCase();
          }
        })
        .catch(function (err) {
          console.error("Could not load student profile:", err);
          document.getElementById("studentName").textContent = user.email;
          document.getElementById("avatarInitial").textContent = user.email.charAt(0).toUpperCase();
        });
    }

    // ──────────────────────────────────────────
    // Load Grades
    // ──────────────────────────────────────────
    function loadStudentGrades(user) {
      const container = document.getElementById("gradesContainer");

      // ⚙️  Assumes a "Grades" collection where each document has fields:
      //     StudentUID (string), Subject (string), Score (number), Period (string)
      db.collection("Grades")
        .where("StudentUID", "==", user.uid)
        .orderBy("Subject", "asc")
        .get()
        .then(function (snapshot) {
          if (snapshot.empty) {
            container.innerHTML = '<div class="no-grades">No grades have been posted yet. Check back later!</div>';
            return;
          }

          // Build table
          let rows = "";
          snapshot.forEach(function (doc) {
            const d = doc.data();
            const score  = d.Score  != null ? d.Score  : "—";
            const letter = getLetterGrade(score);
            const pillClass = getGradePillClass(letter);

            rows += `
              <tr>
                <td>${d.Subject || "—"}</td>
                <td>${d.Period  || "—"}</td>
                <td>${score !== "—" ? score + "%" : "—"}</td>
                <td><span class="grade-pill ${pillClass}">${letter}</span></td>
              </tr>`;
          });

          container.innerHTML = `
            <table class="grades-table">
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Term / Period</th>
                  <th>Score</th>
                  <th>Grade</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>`;
        })
        .catch(function (err) {
          console.error("Error loading grades:", err);
          container.innerHTML = '<div class="no-grades text-danger">Could not load grades. Please try again later.</div>';
        });
    }

    // ──────────────────────────────────────────
    // Helpers
    // ──────────────────────────────────────────
    function getLetterGrade(score) {
      if (score === "—" || score == null) return "—";
      if (score >= 90) return "A";
      if (score >= 80) return "B";
      if (score >= 70) return "C";
      if (score >= 60) return "D";
      return "F";
    }

    function getGradePillClass(letter) {
      const map = { A: "grade-a", B: "grade-b", C: "grade-c", D: "grade-d", F: "grade-f" };
      return map[letter] || "";
    }

    function logoutStudent() {
      if (confirm("Are you sure you want to log out?")) {
        auth.signOut().then(function () {
          window.location.href = "login.html";
        });
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="shared.js"></script>
</body>
</html>
