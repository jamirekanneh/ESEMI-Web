<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Elizabeth Sele Mulbah Institute</title>

  <link rel="stylesheet" href="shared.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top right, var(--brand-red-dark), var(--brand-bg));
      color: var(--brand-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    [data-theme="dark"] body {
       background: radial-gradient(circle at top right, #3b0707, var(--brand-bg));
    }

    .login-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: var(--brand-red);
    }

    .login-subtitle {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--brand-text);
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 0.85rem;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      outline: none;
      background: rgba(0,0,0,0.02);
      color: var(--brand-text);
      transition: var(--transition-base);
    }

    .input-group input:focus {
      border-color: var(--brand-red);
      background: var(--card-bg);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 0.85rem;
      margin-top: 1.5rem;
      background: var(--brand-red);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: var(--transition-base);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }

    .login-btn:hover {
      background: var(--brand-red-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
    }

    .footer-text {
      text-align: center;
      font-size: 0.85rem;
      color: #ccc;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="login-container reveal">
    <h2>ESEMI</h2>
    <p class="login-subtitle">Student Portal Access</p>
    <form id="loginForm">
      <div class="input-group">
        <label for="studentId">Student ID (use your email)</label>
        <input type="text" id="studentId" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <div class="footer-text">
      © 2025 Elizabeth Sele Mulbah Institute. All rights reserved.
    </div>
  </div>

  <script>
    // ✅ Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDzAJqBjlzIGU7_eU8xOZUSbV9GB6cyNYA",
      authDomain: "esemi-loginsheet.firebaseapp.com",
      projectId: "esemi-loginsheet",
      storageBucket: "esemi-loginsheet.firebasestorage.app",
      messagingSenderId: "698345147857",
      appId: "1:698345147857:web:35c8f24f29bf3a7599e4f0"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Handle login
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("studentId").value.trim();
      const password = document.getElementById("password").value;

      const loginBtn = document.querySelector(".login-btn");
      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          alert(`✅ Login successful!\nWelcome, ${user.email}`);
          // Redirect to student dashboard after successful login
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert(`❌ Login failed:\n${error.message}`);
          loginBtn.innerText = "Login";
          loginBtn.disabled = false;
        });
    });
  <script src="shared.js"></script>
</body>
</html>
