<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Elizabeth Sele Mulbah Institute</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- ✅ Firebase SDKs v8 (classic style) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(to bottom right, #000000, #ff0000);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-container {
      background: #ffffff10;
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
      border: 1px solid #ffffff20;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
      color: #fff;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #ffffff20;
      color: #fff;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: #ff0000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: #cc0000;
    }

    .footer-text {
      text-align: center;
      font-size: 0.85rem;
      color: #ccc;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Elizabeth Sele Mulbah Institute</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="studentId">Student ID (use your email)</label>
        <input type="text" id="studentId" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <div class="footer-text">
      © 2025 Elizabeth Sele Mulbah Institute. All rights reserved.
    </div>
  </div>

  <script>
    // ✅ Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDzAJqBjlzIGU7_eU8xOZUSbV9GB6cyNYA",
      authDomain: "esemi-loginsheet.firebaseapp.com",
      projectId: "esemi-loginsheet",
      storageBucket: "esemi-loginsheet.firebasestorage.app",
      messagingSenderId: "698345147857",
      appId: "1:698345147857:web:35c8f24f29bf3a7599e4f0"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Handle login
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("studentId").value.trim();
      const password = document.getElementById("password").value;

      const loginBtn = document.querySelector(".login-btn");
      loginBtn.innerText = "Logging in...";
      loginBtn.disabled = true;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          alert(`✅ Login successful!\nWelcome, ${user.email}`);
          // Redirect to student dashboard after successful login
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert(`❌ Login failed:\n${error.message}`);
          loginBtn.innerText = "Login";
          loginBtn.disabled = false;
        });
    });
  </script>
</body>
</html>
