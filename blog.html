  <div class="container reveal">
    <h1 class="blog-header">ESEMI Blog</h1>
    <p class="text-center mb-5">Learn. Grow. Gist. Stay Healthy.</p>

    <div class="tabs">
      <div class="tab active" id="studyTab" onclick="switchTab('Study')">📚 Study Tips</div>
      <div class="tab" id="healthTab" onclick="switchTab('Health')">🍎 Health Tips</div>
    </div>

    <div id="blogContainer">Loading posts...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDzAJqBjlzIGU7_eU8xOZUSbV9GB6cyNYA",
      authDomain: "esemi-loginsheet.firebaseapp.com",
      projectId: "esemi-loginsheet",
      storageBucket: "esemi-loginsheet.appspot.com",
      messagingSenderId: "698345147857",
      appId: "1:698345147857:web:35c8f24f29bf3a7599e4f0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const blogContainer = document.getElementById("blogContainer");
    const studyTab = document.getElementById("studyTab");
    const healthTab = document.getElementById("healthTab");
    const backToTopBtn = document.getElementById("backToTopBtn");

    function switchTab(type) {
      studyTab.classList.remove("active");
      healthTab.classList.remove("active");
      if (type === "Study") {
        studyTab.classList.add("active");
      } else {
        healthTab.classList.add("active");
      }
      loadPosts(type);
    }

    function formatDate(dateObj) {
      if (!dateObj || !dateObj.seconds) return new Date().toLocaleDateString();
      return new Date(dateObj.seconds * 1000).toLocaleDateString("en-US", {
        year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    const fallbackPosts = {
      "Study": [
        { "Blog Title": "Master the Pomodoro Technique", "Content": "Break your study sessions into 25-minute blocks followed by a 5-minute break. This keeps your brain fresh and focused!", "Date": { seconds: Date.now()/1000 } },
        { "Blog Title": "The Power of Active Recall", "Content": "Instead of just reading your notes, try to explain the concept out loud as if you were teaching someone else. It's the best way to memorize!", "Date": { seconds: (Date.now()/1000) - 86400 } }
      ],
      "Health": [
        { "Blog Title": "Hydration & Focus", "Content": "Did you know that even mild dehydration can lower your concentration? Keep a water bottle on your desk at all times.", "Date": { seconds: Date.now()/1000 } },
        { "Blog Title": "The Importance of Sleep", "Content": "Aim for 7-9 hours of sleep. Your brain processes everything you learned during the day while you rest!", "Date": { seconds: (Date.now()/1000) - 86400 } }
      ]
    };

    async function loadPosts(kind) {
      blogContainer.innerHTML = "<p class='text-center'>Syncing with ESEMI Database...</p>";
      console.log("🔍 Syncing category:", kind);

      try {
        // Try 'Blogs' first, then 'Blog' if empty
        let snapshot = await db.collection("Blogs").orderBy("Date", "desc").get();
        if (snapshot.empty) {
          snapshot = await db.collection("Blog").orderBy("Date", "desc").get();
        }

        blogContainer.innerHTML = "";
        let allPosts = [];

        snapshot.forEach(doc => {
          const data = doc.data();
          console.log("📄 Raw Data Found:", data); // Debugging info in console

          // Smart-Detection for fields
          const title = data["Blog Title"] || data.Title || data.title || data.Subject || "Untitled Post";
          const content = data.Content || data.content || data.body || data.Body || "";
          const type = (data["Blog Kind"] || data.Kind || data.kind || data.Type || data.type || "").toLowerCase();
          const date = data.Date || data.timestamp || null;

          allPosts.push({ title, content, kind: type, date });
        });

        // Filter by kind (case-insensitive)
        const filtered = allPosts.filter(p => p.kind.includes(kind.toLowerCase()));
        
        // Only use fallbacks if there is absolutely NO data in Firebase for this category
        let displayPosts = filtered.length > 0 ? filtered : (allPosts.length === 0 ? fallbackPosts[kind] : []);

        if (displayPosts.length === 0) {
          blogContainer.innerHTML = `<p class='text-center'>No ${kind} tips found in your database yet.</p>`;
          return;
        }

        displayPosts.forEach((p, index) => {
          const card = document.createElement("div");
          card.className = "blog-card reveal";
          card.style.transitionDelay = `${index * 0.1}s`;
          
          card.innerHTML = `
            <h5 style="color: var(--brand-red); font-weight: 700;">${p.title}</h5>
            <small class="text-muted d-block mb-2">${formatDate(p.date)}</small>
            <p>${p.content}</p>
          `;
          blogContainer.appendChild(card);
          setTimeout(() => card.classList.add('active'), 50);
        });

      } catch (error) {
        console.error("❌ Firebase Error:", error);
        blogContainer.innerHTML = "<p class='text-center text-danger'>Connection issue. Showing default tips.</p>";
        fallbackPosts[kind].forEach(p => {
           const card = document.createElement("div");
           card.className = "blog-card reveal active";
           card.innerHTML = `<h5>${p["Blog Title"]}</h5><small>${formatDate(p.Date)}</small><p>${p.Content}</p>`;
           blogContainer.appendChild(card);
        });
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.onscroll = function () {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        backToTopBtn.style.display = "block";
      } else {
        backToTopBtn.style.display = "none";
      }
    };

    window.onload = () => {
      loadPosts("Study");
    };
  </script>
